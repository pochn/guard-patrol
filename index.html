<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบตรวจการณ์ รปภ.</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; padding: 14px; }
    .app-container { max-width: 440px; margin: 0 auto; }
    .header { text-align: center; padding: 14px 0; }
    .header h2 { font-size: 1.35rem; color: #0f172a; }
    .header p { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
    .card { background: #ffffff; border-radius: 14px; padding: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    .form-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1.05rem; background: #fff; font-weight: 500; }
    
    .btn { display: block; text-align: center; width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn:active { opacity: 0.85; }
    .btn-camera { background-color: #0284c7; color: white; }
    .btn-submit { background-color: #16a34a; color: white; }
    
    .btn-dashboard { 
      background-color: transparent; 
      color: #0284c7; 
      border: 1.5px solid #0284c7; 
      text-decoration: none; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px; 
      margin-top: 12px;
    }
    .btn-dashboard:hover { background-color: #f0f9ff; }

    .queue-section { margin-top: 18px; border-top: 1px dashed #cbd5e1; padding-top: 14px; }
    .queue-header { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 10px; color: #334155; }
    .thumbnail-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 250px; overflow-y: auto; padding: 4px; }
    .thumb-item { position: relative; border-radius: 6px; overflow: hidden; border: 1px solid #e2e8f0; height: 95px; background: #000; }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-item .thumb-tag { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: #fff; font-size: 0.65rem; padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .btn-del-thumb {
      position: absolute; top: 3px; right: 3px; background: rgba(239, 68, 68, 0.85); color: white;
      border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 14px; line-height: 20px;
      text-align: center; cursor: pointer;
    }

    .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 999; padding: 20px; }
    .spinner { width: 44px; height: 44px; border: 4px solid #f3f4f6; border-top: 4px solid #38bdf8; border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 16px; }
    .progress-bar-container { width: 100%; max-width: 300px; height: 12px; background: #334155; border-radius: 6px; overflow: hidden; margin-top: 12px; }
    .progress-bar { width: 0%; height: 100%; background: #22c55e; transition: width 0.3s; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h2>ระบบตรวจการณ์ รปภ.</h2>
      <p id="liveClock">กำลังโหลดเวลา...</p>
    </header>

    <div class="card">
      <div class="form-group">
        <label for="shiftSelect">กะ / ผลัดการปฏิบัติหน้าที่</label>
        <select id="shiftSelect">
          <option value="ผลัดดึก" selected>ผลัดดึก (19:00 - 07:00 น.)</option>
          <option value="ผลัดกลางวัน">ผลัดกลางวัน (07:00 - 19:00 น.)</option>
        </select>
      </div>

      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
      <label for="cameraInput" class="btn btn-camera">
        📷 ถ่ายรูปตรวจการณ์ (สดจากสถานที่)
      </label>

      <canvas id="photoCanvas" style="display: none;"></canvas>

      <div class="queue-section">
        <div class="queue-header">
          <span>รูปที่บันทึกไว้ในรอบนี้:</span>
          <strong id="queueCount">0 รูป</strong>
        </div>
        <div id="thumbnailList" class="thumbnail-list"></div>
      </div>

      <button type="button" id="uploadBatchBtn" class="btn btn-submit" style="display: none;" onclick="submitBatch()">
        🚀 ส่งรายงานทั้งหมดพร้อมกัน (<span id="batchBtnCount">0</span>)
      </button>

      <a href="https://script.google.com/macros/s/AKfycbwAmSw68uxwE5LGEq94ul6ZOTUxqkPf6H2WALQ-nEM/exec" 
         target="_blank" 
         class="btn btn-dashboard">
        📋 เปิดดูประวัติ / ตรวจสอบรูปภาพ
      </a>
    </div>

    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
      <div class="spinner"></div>
      <p id="loadingText">กำลังประมวลผล...</p>
      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    (function checkLineBrowser() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (ua.indexOf("Line") > -1) {
        const currentUrl = window.location.href;
        if (currentUrl.indexOf("openExternalBrowser=1") === -1) {
          const sep = currentUrl.indexOf("?") > -1 ? "&" : "?";
          window.location.href = currentUrl + sep + "openExternalBrowser=1";
        }
      }
    })();

    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzYnHN2Yec1gJVkwWnjiNXkVJDDo4YCpxKcGdTybW48PE7Qoz_8a8Zw2EcuTO6NN4zp/exec";

    let db;
    let currentCoordinates = { lat: null, lng: null };

    const request = indexedDB.open("PatrolDB", 1);
    request.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains("patrol_queue")) {
        db.createObjectStore("patrol_queue", { keyPath: "id", autoIncrement: true });
      }
    };
    request.onsuccess = function(e) {
      db = e.target.result;
      loadQueueFromDB();
    };

    setInterval(() => {
      const el = document.getElementById('liveClock');
      if (el) el.innerText = new Date().toLocaleString('th-TH');
    }, 1000);

    window.onload = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            currentCoordinates.lat = pos.coords.latitude.toFixed(6);
            currentCoordinates.lng = pos.coords.longitude.toFixed(6);
          }, 
          null, 
          { enableHighAccuracy: true, timeout: 10000 }
        );
      }
    };

    document.getElementById('cameraInput').addEventListener('change', function(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const now = Date.now();
      const fileAgeSeconds = Math.abs(now - file.lastModified) / 1000;

      if (fileAgeSeconds > 35) {
        alert("⚠️ ระบบไม่อนุญาตให้เลือกรูปภาพจากคลังภาพ!\n\nกรุณากดถ่ายภาพสดจากสถานที่ตรวจการณ์เท่านั้น");
        document.getElementById('cameraInput').value = '';
        return;
      }

      const overlay = document.getElementById('loadingOverlay');
      document.getElementById('loadingText').innerText = "กำลังประทับเวลาและบันทึกลงเครื่อง...";
      overlay.style.display = 'flex';

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          processAndSaveToDB(img);
          overlay.style.display = 'none';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function processAndSaveToDB(img) {
      const canvas = document.getElementById('photoCanvas');
      const ctx = canvas.getContext('2d');

      const maxDim = 1024;
      let width = img.width;
      let height = img.height;
      if (width > height) {
        if (width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        }
      } else {
        if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }

      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(img, 0, 0, width, height);

      const now = new Date();
      const timeStr = 'เวลา: ' + now.toLocaleString('th-TH');
      const fileTimeStr = now.getFullYear() + 
        String(now.getMonth() + 1).padStart(2, '0') + 
        String(now.getDate()).padStart(2, '0') + '_' + 
        String(now.getHours()).padStart(2, '0') + 
        String(now.getMinutes()).padStart(2, '0') + 
        String(now.getSeconds()).padStart(2, '0');

      const shift = document.getElementById('shiftSelect').value;
      const locStr = currentCoordinates.lat ? `พิกัด: ${currentCoordinates.lat}, ${currentCoordinates.lng}` : 'ไม่พบพิกัด';

      const barHeight = Math.max(Math.round(canvas.height * 0.055), 32);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);

      const fontSize = Math.max(Math.round(barHeight * 0.42), 12);
      const textBaselineY = canvas.height - Math.round(barHeight * 0.32);

      ctx.fillStyle = '#ffffff';
      ctx.font = `600 ${fontSize}px sans-serif`;
      ctx.fillText(timeStr, 12, textBaselineY);

      const timeWidth = ctx.measureText(timeStr).width;
      ctx.fillStyle = '#fef08a';
      ctx.font = `500 ${fontSize}px sans-serif`;
      ctx.fillText(` | รปภ. (${shift}) | ${locStr}`, 12 + timeWidth, textBaselineY);

      const base64Data = canvas.toDataURL('image/jpeg', 0.7);

      const record = {
        guardName: shift,
        checkpoint: `ตรวจการณ์ (${shift})`,
        captureTime: now.toLocaleString('th-TH'),
        fileTimeStr: fileTimeStr,
        lat: currentCoordinates.lat,
        lng: currentCoordinates.lng,
        base64Image: base64Data
      };

      const tx = db.transaction(["patrol_queue"], "readwrite");
      tx.objectStore("patrol_queue").add(record);
      tx.oncomplete = function() {
        document.getElementById('cameraInput').value = '';
        loadQueueFromDB();
      };
    }

    function loadQueueFromDB() {
      if (!db) return;
      const tx = db.transaction(["patrol_queue"], "readonly");
      const req = tx.objectStore("patrol_queue").getAll();

      req.onsuccess = function() {
        const items = req.result;
        const list = document.getElementById('thumbnailList');
        list.innerHTML = '';

        items.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = 'thumb-item';
          div.innerHTML = `
            <img src="${item.base64Image}">
            <button class="btn-del-thumb" onclick="deleteSinglePhoto(${item.id})">×</button>
            <div class="thumb-tag">${index + 1}. ${item.guardName}</div>
          `;
          list.appendChild(div);
        });

        const count = items.length;
        document.getElementById('queueCount').innerText = `${count} รูป`;
        document.getElementById('batchBtnCount').innerText = `${count}`;
        document.getElementById('uploadBatchBtn').style.display = count > 0 ? 'block' : 'none';
      };
    }

    function deleteSinglePhoto(id) {
      if (!confirm("ต้องการลบภาพนี้ใช่หรือไม่?")) return;
      const tx = db.transaction(["patrol_queue"], "readwrite");
      tx.objectStore("patrol_queue").delete(id);
      tx.oncomplete = () => loadQueueFromDB();
    }

    async function submitBatch() {
      const tx = db.transaction(["patrol_queue"], "readonly");
      const req = tx.objectStore("patrol_queue").getAll();

      req.onsuccess = async function() {
        const items = req.result;
        if (items.length === 0) return;

        if (!confirm(`ยืนยันการส่งรายงานทั้งหมด ${items.length} รูป ขึ้นระบบใช่หรือไม่?`)) return;

        const total = items.length;
        let completed = 0;
        const overlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const progressBar = document.getElementById('progressBar');

        overlay.style.display = 'flex';
        progressBar.style.width = '0%';

        for (let i = 0; i < total; i++) {
          const item = items[i];
          loadingText.innerText = `กำลังส่งรูปที่ ${i + 1} จาก ${total} รูป...`;

          try {
            await uploadSingleItem(item);
            await removeRecordFromDB(item.id);
            completed++;
            progressBar.style.width = `${Math.round((completed / total) * 100)}%`;
          } catch (err) {
            alert(`รูปที่ ${i + 1} ส่งไม่สำเร็จ: ${err}\nภาพที่เหลือยังอยู่ในเครื่อง สามารถกดยิงซ้ำได้`);
            overlay.style.display = 'none';
            loadQueueFromDB();
            return;
          }
        }

        overlay.style.display = 'none';
        alert(`✓ ส่งรายงานตรวจการณ์ครบทั้ง ${total} รูป เรียบร้อยแล้ว!`);
        loadQueueFromDB();
      };
    }

    function removeRecordFromDB(id) {
      return new Promise((resolve) => {
        const tx = db.transaction(["patrol_queue"], "readwrite");
        tx.objectStore("patrol_queue").delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    function uploadSingleItem(item) {
      return fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(item)
      })
      .then(res => res.json())
      .then(res => {
        if (!res.success) throw new Error(res.message);
        return res;
      });
    }
  </script>
</body>
</html>
