<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบตรวจการณ์ รปภ.</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; padding: 14px; }
    .app-container { max-width: 480px; margin: 0 auto; }
    .header { text-align: center; padding: 16px 0; }
    .header h2 { font-size: 1.35rem; color: #0f172a; }
    .header p { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
    .card { background: #ffffff; border-radius: 14px; padding: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; background: #fff; }
    
    .btn { display: block; text-align: center; width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn:active { opacity: 0.85; }
    .btn-camera { background-color: #0284c7; color: white; }
    .btn-submit { background-color: #16a34a; color: white; }

    .queue-section { margin-top: 20px; border-top: 1px dashed #cbd5e1; padding-top: 14px; }
    .queue-header { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 10px; color: #334155; }
    .thumbnail-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 260px; overflow-y: auto; padding: 4px; }
    .thumb-item { position: relative; border-radius: 6px; overflow: hidden; border: 1px solid #e2e8f0; height: 95px; background: #000; }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-item .thumb-tag { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: #fff; font-size: 0.65rem; padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .btn-del-thumb {
      position: absolute; top: 3px; right: 3px; background: rgba(239, 68, 68, 0.85); color: white;
      border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 14px; line-height: 20px;
      text-align: center; cursor: pointer;
    }

    .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 999; padding: 20px; }
    .spinner { width: 44px; height: 44px; border: 4px solid #f3f4f6; border-top: 4px solid #38bdf8; border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 16px; }
    .progress-bar-container { width: 100%; max-width: 300px; height: 12px; background: #334155; border-radius: 6px; overflow: hidden; margin-top: 12px; }
    .progress-bar { width: 0%; height: 100%; background: #22c55e; transition: width 0.3s; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h2>ระบบตรวจการณ์ รปภ.</h2>
      <p id="liveClock">กำลังโหลดเวลา...</p>
    </header>

    <div class="card">
      <div class="form-group">
        <label for="guardName">ชื่อ / รหัส รปภ.</label>
        <input type="text" id="guardName" placeholder="เช่น นายสมชาย (ผลัดดึก)">
      </div>

      <div class="form-group">
        <label for="checkpoint">จุดตรวจ / บริเวณ</label>
        <select id="checkpoint">
          <option value="ป้อมหน้า">1. ป้อมหน้า (ทางเข้า-ออก)</option>
          <option value="ซอย 1-3">2. ซอย 1-3</option>
          <option value="สวนสาธารณะ / คลับเฮาส์">3. สวนสาธารณะ / คลับเฮาส์</option>
          <option value="ซอย 4-6">4. ซอย 4-6</option>
          <option value="แนวกำแพงท้ายโครงการ">5. แนวกำแพงท้ายโครงการ</option>
          <option value="จุดอื่นๆ">6. อื่นๆ</option>
        </select>
      </div>

      <!-- บังคับเปิดกล้องหลังสดบนมือถือ 100% ด้วย label + input ซ่อน -->
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
      <label for="cameraInput" class="btn btn-camera" onclick="return validateBeforeCamera()">
        📷 ถ่ายรูปจุดตรวจ (บันทึกลงเครื่อง)
      </label>

      <canvas id="photoCanvas" style="display: none;"></canvas>

      <div class="queue-section">
        <div class="queue-header">
          <span>รูปที่บันทึกไว้ในรอบนี้:</span>
          <strong id="queueCount">0 รูป</strong>
        </div>
        <div id="thumbnailList" class="thumbnail-list"></div>
      </div>

      <button type="button" id="uploadBatchBtn" class="btn btn-submit" style="display: none;" onclick="submitBatch()">
        🚀 ส่งรายงานทั้งหมดพร้อมกัน (<span id="batchBtnCount">0</span>)
      </button>
    </div>

    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
      <div class="spinner"></div>
      <p id="loadingText">กำลังประมวลผล...</p>
      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // ** ใส่ Web App URL ของ Google Apps Script ของคุณที่นี่ (ลงท้ายด้วย /exec) **
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzYnHN2Yec1gJVkwWnjiNXkVJDDo4YCpxKcGdTybW48PE7Qoz_8a8Zw2EcuTO6NN4zp/exec";

    let db;
    let currentCoordinates = { lat: null, lng: null };

    // เชื่อมต่อ IndexedDB ของเครื่องมือถือ
    const request = indexedDB.open("PatrolDB", 1);
    request.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains("patrol_queue")) {
        db.createObjectStore("patrol_queue", { keyPath: "id", autoIncrement: true });
      }
    };
    request.onsuccess = function(e) {
      db = e.target.result;
      loadQueueFromDB();
    };
    request.onerror = function(e) {
      console.error("IndexedDB error:", e);
    };

    setInterval(() => {
      const el = document.getElementById('liveClock');
      if (el) el.innerText = new Date().toLocaleString('th-TH');
    }, 1000);

    // ดึงพิกัด GPS อัตโนมัติ
    window.onload = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            currentCoordinates.lat = pos.coords.latitude.toFixed(6);
            currentCoordinates.lng = pos.coords.longitude.toFixed(6);
          }, 
          null, 
          { enableHighAccuracy: true, timeout: 10000 }
        );
      }
    };

    function validateBeforeCamera() {
      const guardName = document.getElementById('guardName').value.trim();
      if (!guardName) {
        alert('กรุณาระบุชื่อ รปภ. ก่อนเริ่มถ่ายภาพครับ');
        document.getElementById('guardName').focus();
        return false;
      }
      return true;
    }

    // เมื่อถ่ายภาพเสร็จ
    document.getElementById('cameraInput').addEventListener('change', function(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const overlay = document.getElementById('loadingOverlay');
      const loadingText = document.getElementById('loadingText');
      loadingText.innerText = "กำลังประทับเวลาและบันทึกภาพลงเครื่อง...";
      overlay.style.display = 'flex';

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          processAndSaveToDB(img);
          overlay.style.display = 'none';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function processAndSaveToDB(img) {
      const canvas = document.getElementById('photoCanvas');
      const ctx = canvas.getContext('2d');

      // ย่อความกว้าง/สูงไม่เกิน 1024px ป้องกันเครื่องค้าง
      const maxDim = 1024;
      let width = img.width;
      let height = img.height;
      if (width > height) {
        if (width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        }
      } else {
        if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }

      canvas.width = width;
      canvas.height = height;
      ctx.drawImage(img, 0, 0, width, height);

      // วาด Watermark วันที่ เวลา พิกัด
      const now = new Date();
      const timeStr = 'เวลาถ่าย: ' + now.toLocaleString('th-TH');
      const fileTimeStr = now.getFullYear() + 
        String(now.getMonth() + 1).padStart(2, '0') + 
        String(now.getDate()).padStart(2, '0') + '_' + 
        String(now.getHours()).padStart(2, '0') + 
        String(now.getMinutes()).padStart(2, '0') + 
        String(now.getSeconds()).padStart(2, '0');

      const checkpoint = document.getElementById('checkpoint').value;
      const guard = document.getElementById('guardName').value.trim() || 'ไม่ระบุ';
      const locStr = currentCoordinates.lat ? `พิกัด: ${currentCoordinates.lat}, ${currentCoordinates.lng}` : 'พิกัด: ไม่พบสัญญาณ';

      const barHeight = Math.max(canvas.height * 0.12, 65);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);

      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${Math.round(barHeight * 0.28)}px sans-serif`;
      ctx.fillText(`${timeStr} | ${checkpoint}`, 14, canvas.height - (barHeight * 0.55));

      ctx.fillStyle = '#fde047';
      ctx.font = `${Math.round(barHeight * 0.24)}px sans-serif`;
      ctx.fillText(`รปภ: ${guard} | ${locStr}`, 14, canvas.height - (barHeight * 0.2));

      const base64Data = canvas.toDataURL('image/jpeg', 0.65);

      const record = {
        guardName: guard,
        checkpoint: checkpoint,
        captureTime: now.toLocaleString('th-TH'),
        fileTimeStr: fileTimeStr,
        lat: currentCoordinates.lat,
        lng: currentCoordinates.lng,
        base64Image: base64Data
      };

      const tx = db.transaction(["patrol_queue"], "readwrite");
      tx.objectStore("patrol_queue").add(record);
      tx.oncomplete = function() {
        document.getElementById('cameraInput').value = '';
        loadQueueFromDB();
      };
    }

    function loadQueueFromDB() {
      if (!db) return;
      const tx = db.transaction(["patrol_queue"], "readonly");
      const req = tx.objectStore("patrol_queue").getAll();

      req.onsuccess = function() {
        const items = req.result;
        const list = document.getElementById('thumbnailList');
        list.innerHTML = '';

        items.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = 'thumb-item';
          div.innerHTML = `
            <img src="${item.base64Image}">
            <button class="btn-del-thumb" onclick="deleteSinglePhoto(${item.id})">×</button>
            <div class="thumb-tag">${index + 1}. ${item.checkpoint}</div>
          `;
          list.appendChild(div);
        });

        const count = items.length;
        document.getElementById('queueCount').innerText = `${count} รูป`;
        document.getElementById('batchBtnCount').innerText = `${count}`;
        document.getElementById('uploadBatchBtn').style.display = count > 0 ? 'block' : 'none';
      };
    }

    function deleteSinglePhoto(id) {
      if (!confirm("ต้องการลบภาพนี้ใช่หรือไม่?")) return;
      const tx = db.transaction(["patrol_queue"], "readwrite");
      tx.objectStore("patrol_queue").delete(id);
      tx.oncomplete = () => loadQueueFromDB();
    }

    // ยิงส่งรูปขึ้น Google Drive ผ่านคำสั่ง Fetch API
    async function submitBatch() {
      if (!GAS_API_URL || GAS_API_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
        alert("กรุณาใส่ URL ของ Google Apps Script ในตัวแปร GAS_API_URL ก่อนใช้งานครับ");
        return;
      }

      const tx = db.transaction(["patrol_queue"], "readonly");
      const req = tx.objectStore("patrol_queue").getAll();

      req.onsuccess = async function() {
        const items = req.result;
        if (items.length === 0) return;

        if (!confirm(`ยืนยันการส่งรายงานทั้งหมด ${items.length} รูป ขึ้นระบบใช่หรือไม่?`)) return;

        const total = items.length;
        let completed = 0;
        const overlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const progressBar = document.getElementById('progressBar');

        overlay.style.display = 'flex';
        progressBar.style.width = '0%';

        for (let i = 0; i < total; i++) {
          const item = items[i];
          loadingText.innerText = `กำลังส่งรูปที่ ${i + 1} จาก ${total} รูป...`;

          try {
            await uploadSingleItem(item);
            await removeRecordFromDB(item.id);
            completed++;
            progressBar.style.width = `${Math.round((completed / total) * 100)}%`;
          } catch (err) {
            alert(`รูปที่ ${i + 1} (${item.checkpoint}) ส่งไม่สำเร็จ: ${err}\nภาพที่เหลือยังอยู่ในเครื่อง สามารถกดยิงซ้ำได้`);
            overlay.style.display = 'none';
            loadQueueFromDB();
            return;
          }
        }

        overlay.style.display = 'none';
        alert(`✓ ส่งรายงานตรวจการณ์ครบทั้ง ${total} รูป เรียบร้อยแล้ว!`);
        loadQueueFromDB();
      };
    }

    function removeRecordFromDB(id) {
      return new Promise((resolve) => {
        const tx = db.transaction(["patrol_queue"], "readwrite");
        tx.objectStore("patrol_queue").delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    function uploadSingleItem(item) {
      return fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // ใช้ text/plain เพื่อป้องกันติด CORS บนเบราว์เซอร์
        body: JSON.stringify(item)
      })
      .then(res => res.json())
      .then(res => {
        if (!res.success) throw new Error(res.message);
        return res;
      });
    }
  </script>
</body>
</html>
