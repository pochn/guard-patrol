<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจสอบภาพตรวจการณ์ รปภ.</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; padding: 16px; }
    .container { max-width: 900px; margin: 0 auto; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; color: #0f172a; }
    
    .filter-card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-card input[type="date"] { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
    .btn-search { padding: 10px 20px; background-color: #0284c7; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card-item { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
    .card-img { width: 100%; height: 200px; object-fit: cover; cursor: pointer; display: block; background: #e2e8f0; }
    .card-body { padding: 12px; font-size: 0.85rem; }
    .card-body p { margin-bottom: 4px; }
    .checkpoint-badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 4px; font-weight: 600; margin-bottom: 6px; }
    
    /* Modal ดูภาพขยาย */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal img { max-width: 100%; max-height: 85vh; border-radius: 8px; }
    .modal-close { position: absolute; top: 15px; right: 20px; color: white; font-size: 30px; cursor: pointer; }
    
    .loading { text-align: center; padding: 40px; color: #64748b; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📋 ประวัติการตรวจการณ์ รปภ.</h1>
    </div>

    <div class="filter-card">
      <div>
        <label for="searchDate"><strong>เลือกวันที่ตรวจ: </strong></label>
        <input type="date" id="searchDate">
      </div>
      <button class="btn-search" onclick="fetchLogs()">ค้นหารายการ</button>
    </div>

    <div id="loading" class="loading" style="display: none;">กำลังโหลดข้อมูลรูปภาพ...</div>
    <div id="logsGrid" class="grid"></div>
  </div>

  <!-- Modal สำหรับดูภาพขนาดใหญ่ -->
  <div id="imgModal" class="modal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <img id="modalImg" src="">
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzYnHN2Yec1gJVkwWnjiNXkVJDDo4YCpxKcGdTybW48PE7Qoz_8a8Zw2EcuTO6NN4zp/exec";

    // ตั้งค่าเริ่มต้นของช่องวันที่ให้เป็นวันปัจจุบัน
    window.onload = function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('searchDate').value = today;
      fetchLogs();
    };

    function fetchLogs() {
      const dateVal = document.getElementById('searchDate').value;
      const loading = document.getElementById('loading');
      const grid = document.getElementById('logsGrid');

      loading.style.display = 'block';
      grid.innerHTML = '';

      fetch(`${GAS_API_URL}?date=${encodeURIComponent(dateVal)}`)
        .then(res => res.json())
        .then(res => {
          loading.style.display = 'none';
          if (!res.success) {
            alert('เกิดข้อผิดพลาด: ' + res.message);
            return;
          }

          if (res.logs.length === 0) {
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 30px;">ไม่พบประวัติการตรวจในวันที่เลือก</div>';
            return;
          }

          res.logs.forEach(log => {
            const mapLink = (log.lat && log.lat !== "N/A") 
              ? `<a href="https://maps.google.com/?q=${log.lat},${log.lng}" target="_blank" style="color: #0284c7;">📍 ดูแผนที่พิกัด</a>` 
              : `<span>📍 ไม่พบพิกัด</span>`;

            const item = document.createElement('div');
            item.className = 'card-item';
            item.innerHTML = `
              <img class="card-img" src="${log.imgSrc}" loading="lazy" onclick="openModal('${log.imgSrc}')">
              <div class="card-body">
                <div class="checkpoint-badge">${log.checkpoint}</div>
                <p><strong>เวลา:</strong> ${log.captureTime}</p>
                <p><strong>เจ้าหน้าที่:</strong> ${log.guardName}</p>
                <p>${mapLink} | <a href="${log.fileUrl}" target="_blank" style="color: #64748b;">เปิดไฟล์ Drive</a></p>
              </div>
            `;
            grid.appendChild(item);
          });
        })
        .catch(err => {
          loading.style.display = 'none';
          alert('ไม่สามารถเชื่อมต่อฐานข้อมูลได้: ' + err);
        });
    }

    function openModal(src) {
      document.getElementById('modalImg').src = src;
      document.getElementById('imgModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imgModal').style.display = 'none';
    }
  </script>
</body>
</html>
